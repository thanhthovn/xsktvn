<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>// XSKTVN SCRAPING .....</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #35d06f;
            --green-dim: #239b55;
            --green-dark: #173d28;
            --bg: #18201b;
            --bg-panel: #202a23;
            --red: #ff2a2a;
            --yellow: #ffd700;
            --cyan: #00ffff;
            --orange: #ff4500;
            --orange-light: #ff8c00;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: #121812;
            background-image:
                repeating-linear-gradient(0deg, rgba(53, 208, 111, 0.035) 0px, rgba(53, 208, 111, 0.035) 1px, transparent 1px, transparent 3px),
                radial-gradient(ellipse at center, #26352b 0%, #111711 100%);
            min-height: 100vh;
            color: var(--green);
            padding: 15px;
            font-size: 13px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(53, 208, 111, 0.035) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            animation: scan 8s linear infinite;
        }
        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: var(--bg-panel);
            border: 2px solid var(--green);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(53, 208, 111, 0.18), inset 0 0 20px rgba(53, 208, 111, 0.045);
            padding: 20px 25px 30px;
            position: relative;
        }

        .titlebar {
            display: flex; align-items: center; gap: 8px;
            padding-bottom: 12px; margin-bottom: 15px;
            border-bottom: 1px dashed var(--green-dim);
            font-size: 0.85rem; color: var(--green-dim);
        }
        .titlebar .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #ff5f56; box-shadow: 0 0 6px #ff5f56; }
        .dot.yellow { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e; }
        .dot.green { background: #27c93f; box-shadow: 0 0 6px #27c93f; }
        .titlebar .path { margin-left: auto; color: var(--green-dim); }

        h1 {
            text-align: center; font-size: 1.7rem; color: var(--green);
            margin-bottom: 6px;
            text-shadow: 0 0 4px rgba(53, 208, 111, 0.55);
            letter-spacing: 2px; font-weight: 800;
        }
        h1::before { content: '> '; color: var(--green-dim); }
        h1::after { content: '_'; animation: blink 1s infinite; color: var(--green); }

        .sub-title {
            text-align: center; font-size: 0.85rem;
            color: var(--green-dim); margin-bottom: 20px; letter-spacing: 1px;
        }
        .sub-title::before { content: '// '; color: #00aa2c; }

        /* ===== NÚT ICON PHÂN TÍCH Ở GÓC PHẢI ===== */
        .prob-icon-btn {
            position: absolute;
            top: 60px;
            right: 25px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(53, 208, 111, 0.045);
            color: var(--green-dim);
            border: 1px solid var(--green-dim);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s;
            opacity: 0.4;
            z-index: 100;
            font-family: inherit;
        }
        .prob-icon-btn:hover {
            opacity: 1;
            background: rgba(255, 69, 0, 0.15);
            color: var(--orange-light);
            border-color: var(--orange);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.5);
            transform: scale(1.1) rotate(15deg);
        }
        .prob-icon-btn.active {
            opacity: 1;
            background: var(--orange);
            color: #fff;
            border-color: var(--orange);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.7);
        }

        @media (max-width: 650px) {
            .prob-icon-btn {
                top: 15px;
                right: 15px;
                width: 35px;
                height: 35px;
                font-size: 1.1rem;
            }
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .date-form, .prob-form {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; flex-wrap: wrap; padding: 15px;
            background: rgba(53, 208, 111, 0.035);
            border: 1px solid var(--green-dim);
            border-radius: 4px; margin-bottom: 18px; font-size: 0.9rem;
        }
        .date-form label, .prob-form label {
            font-weight: 700; color: var(--green);
            text-shadow: 0 0 4px var(--green-dim);
        }

        /* ===== ĐIỀU HƯỚNG NGÀY ===== */
        .date-nav-btn {
            width: 42px;
            height: 38px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 42px;
            background: rgba(53, 208, 111, 0.08);
            color: var(--green);
            border: 1px solid var(--green-dim);
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1;
            transition: all 0.15s;
        }
        .date-nav-btn:hover {
            background: var(--green);
            color: #000;
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(53, 208, 111, 0.55);
            transform: scale(1.05);
        }
        .date-nav-btn:active {
            transform: scale(0.96);
        }
        .date-form .date-nav-btn:focus-visible {
            outline: 1px solid var(--cyan);
            outline-offset: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.45);
        }
        .date-form label::before, .prob-form label::before {
            content: '$ '; color: var(--green-dim);
        }
        .weekday-display {
            color: var(--yellow);
            font-weight: 800;
            letter-spacing: 0.8px;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.45);
            white-space: nowrap;
        }

        .date-form input[type="date"],
        .prob-form input[type="number"],
        .prob-form input[type="text"],
        .prob-form input[type="date"],
        .prob-form select {
            padding: 8px 12px; font-size: 0.9rem; font-family: inherit;
            border: 1px solid var(--green); border-radius: 3px;
            background: #151c17; color: var(--green);
            color-scheme: dark;
            outline: none;
        }
        .prob-form input[type="number"] { width: 70px; }
        .prob-form input[type="text"] { width: 220px; }
        .prob-form select { cursor: pointer; }
        .date-form input:focus, .prob-form input:focus, .prob-form select:focus {
            box-shadow: 0 0 12px var(--green);
        }

        /* ===== RADIO GROUP ===== */
        .range-mode-group {
            display: flex;
            gap: 16px;
            padding: 8px 14px;
            border: 1px dashed var(--green-dim);
            border-radius: 3px;
            background: rgba(53, 208, 111, 0.025);
        }
        .range-mode-group label {
            font-weight: 600; color: var(--green-dim);
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            text-shadow: none;
        }
        .range-mode-group label::before { content: ''; }
        .range-mode-group input[type="radio"] {
            accent-color: var(--green);
            cursor: pointer;
        }
        .range-mode-group label.active { color: var(--green); text-shadow: 0 0 6px var(--green); }

        .btn {
            padding: 9px 22px; font-size: 0.9rem; font-weight: 700; font-family: inherit;
            color: #000; background: #35d06f; border: 1px solid var(--green);
            border-radius: 3px; cursor: pointer; letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            transition: all 0.15s;
        }
        .btn:hover {
            background: #151c17; color: var(--green);
            box-shadow: 0 0 20px var(--green);
        }
        .btn:disabled {
            opacity: 0.4; cursor: not-allowed;
            box-shadow: none;
        }
        .btn-orange {
            background: var(--orange); border-color: var(--orange);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }
        .btn-orange:hover {
            background: #151c17; color: var(--orange);
            box-shadow: 0 0 20px var(--orange);
        }

        .stats {
            display: flex; justify-content: center; gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--green-dark);
        }
        .stat-box {
            background: rgba(53, 208, 111, 0.035); border: 1px solid var(--green-dim);
            border-left: 3px solid var(--green); border-radius: 3px;
            padding: 10px 18px; text-align: center; min-width: 150px;
        }
        .stat-box .num {
            font-size: 1.4rem; font-weight: 800; color: var(--green);
            text-shadow: 0 0 5px rgba(53, 208, 111, 0.45); font-family: 'Consolas', 'Cascadia Mono', 'Courier New', monospace;
        }
        .stat-box .label {
            font-size: 0.72rem; color: var(--green-dim); margin-top: 3px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .status {
            text-align: center; padding: 12px; font-size: 0.88rem;
            border-radius: 3px; margin-bottom: 18px; display: none;
            font-family: 'Consolas', 'Cascadia Mono', 'Courier New', monospace; letter-spacing: 0.5px;
        }
        .status::before { content: '> '; color: var(--green-dim); }
        .status.loading {
            display: block; background: rgba(0, 255, 255, 0.05);
            color: var(--cyan); border: 1px solid var(--cyan); text-shadow: 0 0 6px var(--cyan);
        }
        .status.error {
            display: block; background: rgba(255, 42, 42, 0.05);
            color: var(--red); border: 1px solid var(--red); text-shadow: 0 0 6px var(--red);
        }
        .status.success {
            display: block; background: rgba(53, 208, 111, 0.045);
            color: var(--green); border: 1px solid var(--green); text-shadow: 0 0 6px var(--green);
        }

        /* ===== NÚT XEM MINH NGỌC KHI CHƯA CÓ DATA ===== */
        .minhngoc-btn-wrap {
            display: flex; justify-content: center; align-items: center;
            margin: 25px auto;
        }
        .minhngoc-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 69, 0, 0.10);
            color: var(--orange-light);
            border: 1px solid var(--orange);
            border-radius: 3px;
            text-decoration: none;
            font-family: inherit; font-size: 0.9rem; font-weight: 700;
            letter-spacing: 0.7px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.25);
            transition: all 0.2s;
        }
        .minhngoc-btn:hover {
            background: var(--orange); color: #fff;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.65);
            transform: translateY(-1px);
        }
        .minhngoc-btn .date {
            color: var(--yellow);
            font-family: 'Consolas', 'Cascadia Mono', 'Courier New', monospace;
        }

        .calendar-section { margin-bottom: 25px; }
        .calendar-title {
            font-size: 1rem; font-weight: 700; color: var(--green);
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .calendar-title > span:first-child {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .calendar-title > span:first-child:hover {
            color: var(--cyan);
            text-shadow: 0 0 8px var(--cyan);
        }
        #calToggle {
            display: inline-block;
            font-size: 0.9rem;
            color: var(--cyan);
            transition: transform 0.2s;
            min-width: 14px;
        }
        #calendarWrap {
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.2s ease;
            max-height: 10000px;
            opacity: 1;
        }
        #calendarWrap.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .legend {
            display: flex; gap: 14px; font-size: 0.75rem;
            color: var(--green-dim); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 2px; }
        .legend-dot.have { background: #35d06f; box-shadow: 0 0 6px var(--green); }
        .legend-dot.missing { background: transparent; border: 1px solid var(--green-dim); }

        .month-grid { margin-bottom: 16px; }
        .month-title {
            font-weight: 700; color: var(--green-dim);
            margin-bottom: 6px; font-size: 0.82rem; letter-spacing: 1px;
        }
        .days-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 3px;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 2px; font-size: 0.72rem; font-weight: 700;
            cursor: pointer; transition: all 0.15s;
            border: 1px solid transparent; user-select: none;
            font-family: 'Consolas', 'Cascadia Mono', 'Courier New', monospace;
        }
        .day-cell.have {
            background: rgba(0, 255, 65, 0.12); color: var(--green);
            border: 1px solid var(--green); text-shadow: 0 0 5px var(--green);
        }
        .day-cell.have:hover {
            background: #35d06f; color: #000;
            box-shadow: 0 0 15px var(--green), 0 0 30px rgba(0, 255, 65, 0.5);
            transform: scale(1.15); text-shadow: none;
        }
        .day-cell.missing {
            background: transparent; color: #65766b;
            cursor: not-allowed; border: 1px solid #506257;
        }
        .day-cell.today {
            border: 2px solid var(--red);
            box-shadow: 0 0 8px rgba(255, 42, 42, 0.5);
            color: var(--red);
        }

        .region { margin-bottom: 28px; }
        .region-header {
            font-size: 1.05rem; font-weight: 700;
            padding: 8px 15px; border-radius: 3px 3px 0 0;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .region-header::before { content: '>>> '; opacity: 0.7; }
        .region-nam .region-header {
            background: linear-gradient(90deg, #234b32, #326845);
            color: var(--green); border: 1px solid var(--green);
            text-shadow: 0 0 6px var(--green);
        }
        .region-trung .region-header {
            background: linear-gradient(90deg, #24465a, #32657e);
            color: var(--cyan); border: 1px solid var(--cyan);
            text-shadow: 0 0 6px var(--cyan);
        }
        .region-bac .region-header {
            background: linear-gradient(90deg, #5a3030, #794040);
            color: var(--red); border: 1px solid var(--red);
            text-shadow: 0 0 6px var(--red);
        }

        .station-grid {
            display: grid; gap: 0;
            border: 1px solid var(--green-dim); border-top: none;
            border-radius: 0 0 3px 3px; overflow: hidden;
        }
        .region-nam .station-grid,
        .region-trung .station-grid { grid-template-columns: repeat(3, 1fr); }
        .region-bac .station-grid { grid-template-columns: 1fr; }

        .station-card {
            border-right: 1px dashed var(--green-dark);
            background: rgba(53, 208, 111, 0.025);
            position: relative;
        }
        .station-card:last-child { border-right: none; }

        .station-card.main-station {
            background: linear-gradient(135deg, rgba(255, 118, 45, 0.13), rgba(255, 140, 0, 0.06));
            border-right: 2px solid var(--orange);
        }
        .station-card.main-station .station-header {
            background: linear-gradient(90deg, rgba(255, 118, 45, 0.18), rgba(255, 140, 0, 0.1));
            border-bottom: 2px solid var(--orange);
        }
        .station-card.main-station .station-name {
            color: var(--orange-light);
            text-shadow: 0 0 8px var(--orange);
        }
        .station-card.main-station .prize-numbers {
            color: var(--yellow);
        }
        .station-card.main-station .special-prize {
            color: #ff2a2a;
            text-shadow: 0 0 10px var(--orange), 0 0 20px rgba(255, 69, 0, 0.7);
            font-size: 1.25rem;
        }

        .station-header {
            background: rgba(0, 255, 65, 0.06);
            padding: 8px 12px;
            border-bottom: 1px dashed var(--green-dim);
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 4px;
        }
        .station-name {
            font-weight: 800; font-size: 1rem;
            color: var(--green); text-shadow: 0 0 4px rgba(35, 155, 85, 0.4);
            letter-spacing: 1px;
        }
        .station-name::before { content: '['; color: var(--green-dim); }
        .station-name::after { content: ']'; color: var(--green-dim); }
        .station-code {
            font-size: 0.68rem; color: var(--green-dim);
            padding: 2px 8px;
            border: 1px dashed var(--green-dark);
            border-radius: 2px;
        }

        .prize-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .prize-table tr { border-bottom: 1px dashed var(--green-dark); }
        .prize-table tr:last-child { border-bottom: none; }
        .prize-table tr:hover { background: rgba(53, 208, 111, 0.045); }
        .prize-label {
            padding: 6px 8px 6px 12px;
            font-weight: 600; color: var(--green-dim);
            width: 90px; vertical-align: top; font-size: 0.72rem;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .prize-numbers {
            padding: 6px 10px;
            font-family: 'Consolas', 'Cascadia Mono', 'Courier New', monospace;
            font-size: 1rem; font-weight: 700;
            color: var(--green);
            line-height: 1.6; word-spacing: 8px;
            text-shadow: 0 0 4px var(--green-dim);
        }
        .special-prize {
            color: var(--yellow); font-size: 1.2rem; font-weight: 800;
            text-shadow: 0 0 6px var(--yellow);
        }

        .prob-table {
            width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 15px;
        }
        .prob-table thead th {
            background: rgba(0, 255, 65, 0.1);
            color: var(--green);
            padding: 10px;
            border: 1px solid var(--green-dim);
            text-align: center;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        .prob-table tbody td {
            padding: 8px 10px;
            border: 1px dashed var(--green-dark);
            text-align: center;
            color: var(--green);
            font-family: 'Consolas', 'Cascadia Mono', 'Courier New', monospace;
        }
        .prob-table tbody tr:hover { background: rgba(53, 208, 111, 0.045); }
        .prob-table .rank { color: var(--yellow); font-weight: 800; }
        .prob-table .num-highlight {
            color: var(--yellow); font-weight: 800; font-size: 1rem;
            text-shadow: 0 0 6px var(--yellow);
        }
        .prob-table .percent { color: var(--cyan); font-weight: 700; }

        .prob-summary {
            display: flex; justify-content: center; gap: 15px;
            flex-wrap: wrap; margin: 15px 0;
        }
        .prob-summary .box {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid var(--yellow);
            border-radius: 3px; padding: 10px 18px;
            text-align: center; min-width: 140px;
        }
        .prob-summary .box .val {
            font-size: 1.4rem; font-weight: 800; color: var(--yellow);
            text-shadow: 0 0 8px var(--yellow);
        }
        .prob-summary .box .lbl {
            font-size: 0.7rem; color: var(--yellow); opacity: 0.8;
            text-transform: uppercase; margin-top: 3px;
        }

        .footer {
            text-align: center; margin-top: 30px;
            font-size: 0.75rem; color: var(--green-dim);
            border-top: 1px dashed var(--green-dark);
            padding-top: 15px; letter-spacing: 1px;
        }
        .footer::before { content: '[EOF] '; color: var(--green); }
        .footer a { color: var(--green); text-decoration: none; border-bottom: 1px dashed var(--green-dim); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #151c17; }
        ::-webkit-scrollbar-thumb {
            background: var(--green-dark);
            border: 1px solid var(--green-dim);
            border-radius: 2px;
        }

        @media (max-width: 992px) {
            .region-nam .station-grid,
            .region-trung .station-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 650px) {
            body { padding: 8px; font-size: 12px; }
            .container { padding: 15px; }
            h1 { font-size: 1.2rem; }
            .region-nam .station-grid,
            .region-trung .station-grid { grid-template-columns: 1fr; }
            .station-card { border-right: none; border-bottom: 1px dashed var(--green-dark); }
            .days-row { grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); }
            .prob-table { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="titlebar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="path">~/xsktvn/terminal</span>
        </div>

        <h1>XSKTVN</h1>
        <button class="prob-icon-btn" id="probIconBtn" onclick="toggleProbPanel()" title="Phân tích xác suất">🎲</button>
        <div class="sub-title">KẾT QUẢ XỔ SỐ 03 MIỀN // AUTO-SCRAPED DAILY</div>

        <!-- ===== TAB 1: KẾT QUẢ ===== -->
        <div id="tab-result" class="tab-content active">
            <div class="date-form">
                <button type="button" class="date-nav-btn" id="prevDateBtn" onclick="changeDateBy(-1)" title="Ngày trước" aria-label="Ngày trước">‹</button>
                <label for="dateInput">SELECT_DATE</label>
                <span id="weekdayDisplay" class="weekday-display"></span>
                <input type="date" id="dateInput" />
                <button type="button" class="date-nav-btn" id="nextDateBtn" onclick="changeDateBy(1)" title="Ngày sau" aria-label="Ngày sau">›</button>
            </div>

            <div class="status" id="status"></div>

            <div id="result"></div>

            <div class="calendar-section" id="calendarSection" style="display:none;">
                <div class="calendar-title">
                    <span onclick="toggleCalendar()">
                        <span id="calToggle">▼</span> DATA_STATUS_BY_MONTH
                    </span>
                    <div class="legend" id="calLegend">
                        <div class="legend-item">
                            <div class="legend-dot have"></div>
                            <span>AVAILABLE</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot missing"></div>
                            <span>MISSING</span>
                        </div>
                    </div>
                </div>
                <div id="calendarWrap">
                    <div id="calendar"></div>
                </div>
            </div>

            <div class="stats" id="stats" style="display:none;">
                <div class="stat-box">
                    <div class="num" id="statTotal">0</div>

                </div>

        <!-- ===== TAB 2: XÁC SUẤT ===== -->
        <div id="tab-prob" class="tab-content">
            <div class="prob-form">
                <label>MIỀN</label>
                <select id="probRegion">
                    <option value="nam">Miền Nam</option>
                    <option value="trung">Miền Trung</option>
                    <option value="bac">Miền Bắc</option>
                </select>

                <div id="probWeekdayGroup">
                    <label>THỨ</label>
                    <select id="probWeekday">
                    <option value="all">Cả tuần</option>
                    <option value="1">Thứ 2</option>
                    <option value="2">Thứ 3</option>
                    <option value="3">Thứ 4</option>
                    <option value="4">Thứ 5</option>
                    <option value="5">Thứ 6</option>
                    <option value="6">Thứ 7</option>
                    </select>
                </div>

                <div id="probStationGroup" style="display:none;">
                    <label>ĐÀI</label>
                    <select id="probStation">
                        <option value="all">Tất cả đài Thứ</option>
                    </select>
                </div>

                <label>LOẠI</label>
                <select id="probType">
                    <option value="2so" selected>2 số đuôi</option>
                    <option value="3so">3 số đuôi</option>
                    <option value="2so_dbg8_mtmn">Đầu Đuôi (ĐB + G8)</option>
                    <option value="cap">Cặp số Đá</option>
                    <option value="bo3">Bộ 03 số Đá Vòng</option>
                </select>
            </div>

            <div class="prob-form">
                <label>CHẾ ĐỘ</label>
                <div class="range-mode-group">
                    <label class="active" id="modeYearLbl">
                        <input type="radio" name="rangeMode" value="year" checked onchange="switchRangeMode()" />
                        Từ đầu năm <span id="currentYearLabel">----</span>
                    </label>
                    <label id="modeRecentLbl">
                        <input type="radio" name="rangeMode" value="recent" onchange="switchRangeMode()" />
                        Số ngày gần nhất
                    </label>
                    <label id="modeRangeLbl">
                        <input type="radio" name="rangeMode" value="range" onchange="switchRangeMode()" />
                        Khoảng ngày cụ thể
                    </label>
                </div>

                <div id="probRecentGroup" style="display:none; align-items:center; gap:12px;">
                    <label>SỐ NGÀY</label>
                    <select id="probDays">
                    <option value="7">7 ngày</option>
                    <option value="14">14 ngày</option>
                    <option value="21">21 ngày</option>
                    <option value="28">28 ngày</option>
                    <option value="30">30 ngày</option>
                    <option value="49" selected>49 ngày</option>
                    <option value="100">100 ngày</option>
                    <option value="128">128 ngày</option>
                    <option value="256">256 ngày</option>
                    <option value="365">365 ngày</option>
                    <option value="512">512 ngày</option>
                </select>
                </div>

                <div id="probRangeGroup" style="display:none; align-items:center; gap:12px;">
                    <label>TỪ NGÀY</label>
                    <input type="date" id="probFromDate" />
                    <label>ĐẾN NGÀY</label>
                    <input type="date" id="probToDate" />
                </div>
            </div>

            <div class="prob-form">
                <div id="probExtraGroup" style="display:none;">
                    <label>NHẬP SỐ</label>
                    <input type="text" id="probExtra" placeholder="VD: 23-53 hoặc 15-58-69" />
                </div>
                <button class="btn btn-orange" id="btnAnalyze">🎲 PHÂN TÍCH</button>
            </div>

            <div class="status" id="probStatus"></div>
            <div id="probResult"></div>
        </div>

        <div class="footer">
            SOURCE: <a href="https://www.minhngoc.net" target="_blank">www.minhngoc.net</a>
            &nbsp;|&nbsp; VERSION 8.1.4
        </div>
    </div>

    <script>
        const MAIN_STATIONS_MN = {
            1: "Đồng Tháp", 2: "Vũng Tàu", 3: "Sóc Trăng",
            4: "Bình Thuận", 5: "Bình Dương", 6: "Bình Phước", 0: "Đà Lạt",
        };

        const STATIONS_BY_REGION = {
            nam: [
                "TP. HCM", "Đồng Tháp", "Cà Mau",
                "Bến Tre", "Vũng Tàu", "Bạc Liêu",
                "Đồng Nai", "Cần Thơ", "Sóc Trăng",
                "Tây Ninh", "An Giang", "Bình Thuận",
                "Vĩnh Long", "Bình Dương", "Trà Vinh",
                "Long An", "Bình Phước", "Hậu Giang",
                "Tiền Giang", "Kiên Giang", "Đà Lạt"
            ],
            trung: [
                "Phú Yên", "Huế", "Đắk Lắk", "Quảng Nam",
                "Đà Nẵng", "Khánh Hòa", "Bình Định",
                "Quảng Trị", "Quảng Bình", "Gia Lai",
                "Ninh Thuận", "Quảng Ngãi", "Đắk Nông",
                "Kon Tum"
            ],
            bac: [
                "Hà Nội", "Quảng Ninh", "Bắc Ninh",
                "Hải Phòng", "Nam Định", "Thái Bình"
            ]
        };

        const dateInput = document.getElementById('dateInput');
        const statusBox = document.getElementById('status');
        const resultBox = document.getElementById('result');
        const statsBox = document.getElementById('stats');
        const calendarSection = document.getElementById('calendarSection');
        const calendarBox = document.getElementById('calendar');

        const probStatus = document.getElementById('probStatus');
        const probResult = document.getElementById('probResult');
        const probType = document.getElementById('probType');
        const probRegion = document.getElementById('probRegion');
        const probWeekday = document.getElementById('probWeekday');
        const probStationGroup = document.getElementById('probStationGroup');
        const probStation = document.getElementById('probStation');
        const probDays = document.getElementById('probDays');
        const probExtra = document.getElementById('probExtra');
        const probExtraGroup = document.getElementById('probExtraGroup');
        const btnAnalyze = document.getElementById('btnAnalyze');

        const probFromDate = document.getElementById('probFromDate');
        const probToDate = document.getElementById('probToDate');
        const probRecentGroup = document.getElementById('probRecentGroup');
        const probRangeGroup = document.getElementById('probRangeGroup');

        let availableDates = new Set();
        let currentIsoDate = "";

        // ===== TOGGLE PROB PANEL =====
        function toggleProbPanel() {
            const tabResult = document.getElementById('tab-result');
            const tabProb = document.getElementById('tab-prob');
            const iconBtn = document.getElementById('probIconBtn');

            if (tabProb.classList.contains('active')) {
                tabProb.classList.remove('active');
                tabResult.classList.add('active');
                iconBtn.classList.remove('active');
            } else {
                tabResult.classList.remove('active');
                tabProb.classList.add('active');
                iconBtn.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ===== SWITCH RANGE MODE =====
        function getCurrentYearVN() {
            const now = new Date();
            return Number(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric' }).format(now));
        }

        function getTodayISODateVN() {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Ho_Chi_Minh',
                year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());
        }

        function updateYearModeDates() {
            const year = getCurrentYearVN();
            const today = getTodayISODateVN();
            probFromDate.value = `${year}-01-01`;
            probToDate.value = today;
            document.getElementById('currentYearLabel').textContent = year;
        }

        function switchRangeMode() {
            const mode = document.querySelector('input[name="rangeMode"]:checked').value;
            const yearLbl = document.getElementById('modeYearLbl');
            const recentLbl = document.getElementById('modeRecentLbl');
            const rangeLbl = document.getElementById('modeRangeLbl');

            yearLbl.classList.toggle('active', mode === 'year');
            recentLbl.classList.toggle('active', mode === 'recent');
            rangeLbl.classList.toggle('active', mode === 'range');

            if (mode === 'year') {
                probRecentGroup.style.display = 'none';
                probRangeGroup.style.display = 'none';
                updateYearModeDates();
            } else if (mode === 'recent') {
                probRecentGroup.style.display = 'flex';
                probRangeGroup.style.display = 'none';
            } else {
                probRecentGroup.style.display = 'none';
                probRangeGroup.style.display = 'flex';
                if (!probFromDate.value || !probToDate.value) {
                    const sortedDates = Array.from(availableDates).sort().reverse();
                    if (sortedDates.length > 0) {
                        probToDate.value = sortedDates[0];
                        probFromDate.value = sortedDates[Math.min(29, sortedDates.length - 1)];
                    }
                }
            }
        }
        function toggleCalendar() {
            const wrap = document.getElementById('calendarWrap');
            const toggle = document.getElementById('calToggle');
            const legend = document.getElementById('calLegend');

            if (wrap.classList.contains('collapsed')) {
                wrap.classList.remove('collapsed');
                toggle.textContent = '▼';
                legend.style.display = 'flex';
            } else {
                wrap.classList.add('collapsed');
                toggle.textContent = '▶';
                legend.style.display = 'none';
            }
        }

        function getDefaultDateVN() {
            const now = new Date();
            const vnTime = new Date(now.getTime() + 7 * 60 * 60 * 1000);
            const hourVN = vnTime.getUTCHours();
            const vnToday = new Date(Date.UTC(vnTime.getUTCFullYear(), vnTime.getUTCMonth(), vnTime.getUTCDate()));
            if (hourVN < 16) vnToday.setUTCDate(vnToday.getUTCDate() - 1);
            return vnToday.toISOString().split('T')[0];
        }
        function getRealTodayVN() {
            const now = new Date();
            const vnTime = new Date(now.getTime() + 7 * 60 * 60 * 1000);
            return new Date(Date.UTC(vnTime.getUTCFullYear(), vnTime.getUTCMonth(), vnTime.getUTCDate())).toISOString().split('T')[0];
        }

        const weekdayDisplay = document.getElementById('weekdayDisplay');

        function updateWeekdayDisplay(isoDate) {
            if (!isoDate || !weekdayDisplay) return;

            const [y, m, d] = isoDate.split('-').map(Number);
            const date = new Date(Date.UTC(y, m - 1, d));
            const weekdays = [
                'CHỦ NHẬT',
                'THỨ HAI',
                'THỨ BA',
                'THỨ TƯ',
                'THỨ NĂM',
                'THỨ SÁU',
                'THỨ BẢY'
            ];

            weekdayDisplay.textContent = `[ ${weekdays[date.getUTCDay()]} ]`;
        }

        const todayIso = getDefaultDateVN();
        const realTodayVN = getRealTodayVN();
        dateInput.value = todayIso;
        currentIsoDate = todayIso;
        updateWeekdayDisplay(todayIso);


        function showStatus(type, msg) {
            statusBox.className = 'status ' + type;
            statusBox.textContent = msg;
        }

        // Chuyển ngày trước / ngày sau
        function changeDateBy(offset) {
            if (!dateInput.value) return;

            const [y, m, d] = dateInput.value.split('-').map(Number);
            const date = new Date(Date.UTC(y, m - 1, d));
            date.setUTCDate(date.getUTCDate() + offset);

            const nextIso = [
                date.getUTCFullYear(),
                String(date.getUTCMonth() + 1).padStart(2, '0'),
                String(date.getUTCDate()).padStart(2, '0')
            ].join('-');

            dateInput.value = nextIso;
            updateWeekdayDisplay(nextIso);
            loadResult(nextIso);
        }
        dateInput.addEventListener('change', () => {
            updateWeekdayDisplay(dateInput.value);
            loadResult(dateInput.value);
        });

        function showProbStatus(type, msg) {
            probStatus.className = 'status ' + type;
            probStatus.textContent = msg;
        }

        async function loadIndex() {
            try {
                const res = await fetch(`data/index.json?_=${Date.now()}`);
                if (!res.ok) throw new Error('index.json not found');
                const data = await res.json();
                availableDates = new Set(data.dates || []);
                document.getElementById('statTotal').textContent = data.total || 0;
                document.getElementById('statUpdated').textContent = data.updated || '-';
                statsBox.style.display = 'flex';
                renderCalendar();
                calendarSection.style.display = 'block';

                const sortedDates = Array.from(availableDates).sort().reverse();
                if (sortedDates.length > 0) {
                    probToDate.value = sortedDates[0];
                    probFromDate.value = sortedDates[Math.min(29, sortedDates.length - 1)];
                }
            } catch (err) {
                console.warn(err);
                // FIX: reset state khi index.json lỗi để tránh stale data
                availableDates = new Set();
                statsBox.style.display = 'none';
                calendarSection.style.display = 'none';
            }
        }

        function renderCalendar() {
            if (availableDates.size === 0) return;
            const sortedDates = Array.from(availableDates).sort().reverse();
            const months = {};
            sortedDates.forEach(iso => {
                const [y, m] = iso.split('-');
                const key = `${y}-${m}`;
                if (!months[key]) months[key] = [];
                months[key].push(iso);
            });

            const monthKeys = Object.keys(months).sort().reverse();
            let html = '';
            monthKeys.forEach(key => {
                const [y, m] = key.split('-');
                const days = months[key];
                const dayMap = {};
                days.forEach(iso => dayMap[parseInt(iso.split('-')[2])] = iso);
                const daysInMonth = new Date(parseInt(y), parseInt(m), 0).getDate();

                html += `<div class="month-grid"><div class="month-title">MONTH_${m}_${y} <span style="opacity:0.6;">[${days.length}/${daysInMonth}]</span></div><div class="days-row">`;
                for (let day = 1; day <= daysInMonth; day++) {
                    const iso = `${y}-${m}-${String(day).padStart(2, '0')}`;
                    const hasData = dayMap[day] !== undefined;
                    const isToday = iso === realTodayVN;
                    const cls = ['day-cell', hasData ? 'have' : 'missing', isToday ? 'today' : ''].filter(Boolean).join(' ');
                    if (hasData) html += `<div class="${cls}" onclick="selectDate('${iso}')" title="${iso}">${String(day).padStart(2, '0')}</div>`;
                    else html += `<div class="${cls}" title="${iso}">${String(day).padStart(2, '0')}</div>`;
                }
                html += `</div></div>`;
            });
            calendarBox.innerHTML = html;
        }

        function selectDate(iso) {
            dateInput.value = iso;
            updateWeekdayDisplay(iso);
            loadResult(iso);
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderResult(data) {
            if (!data.regions || data.regions.length === 0) {
                resultBox.innerHTML = '';
                showStatus('error', 'NO_DATA_FOR_THIS_DATE');
                return;
            }
            const [y, m, d] = currentIsoDate.split('-');
            const weekday = new Date(parseInt(y), parseInt(m) - 1, parseInt(d)).getDay();
            const mainStationName = MAIN_STATIONS_MN[weekday] || "";

            let html = '';
            data.regions.forEach(r => {
                html += `<div class="region region-${r.key}"><div class="region-header">${r.name}</div><div class="station-grid">`;
                r.stations.forEach((st) => {
                    const isMain = (r.key === 'nam' && st.name.trim() === mainStationName);
                    const cardClass = isMain ? 'station-card main-station' : 'station-card';
                    html += `<div class="${cardClass}"><div class="station-header"><span class="station-name">${st.name}</span><span class="station-code">${st.code || ''}</span></div><table class="prize-table">`;
                    st.prizes.forEach(p => {
                        const cls = p.label === 'Giải ĐB' ? 'prize-numbers special-prize' : 'prize-numbers';
                        html += `<tr><td class="prize-label">${p.label}</td><td class="${cls}">${p.numbers.join(' &nbsp; ')}</td></tr>`;
                    });
                    html += `</table></div>`;
                });
                html += `</div></div>`;
            });
            resultBox.innerHTML = html;
        }

        // FIX #3: dùng AbortController để tránh race condition khi user đổi ngày liên tục
        let loadResultController = null;

        async function loadResult(isoDate) {
            currentIsoDate = isoDate;
            showStatus('loading', 'LOADING_DATA...');
            resultBox.innerHTML = '';

            // Hủy request cũ nếu có
            if (loadResultController) {
                try { loadResultController.abort(); } catch (e) {}
            }
            loadResultController = new AbortController();
            const signal = loadResultController.signal;

            const year = isoDate.slice(0, 4);
            try {
                const res = await fetch(`data/${year}/${isoDate}.json?_=${Date.now()}`, { signal });
                if (!res.ok) throw new Error('NO_DATA_FOR_THIS_DATE');
                const data = await res.json();
                // Kiểm tra race: nếu user đã đổi ngày trong lúc fetch, bỏ qua response
                if (currentIsoDate !== isoDate) return;
                renderResult(data);
                statusBox.style.display = 'none';
            } catch (err) {
                if (err.name === 'AbortError') return; // request bị hủy, không phải lỗi
                if (currentIsoDate !== isoDate) return;
                if (err.message === 'NO_DATA_FOR_THIS_DATE') {
                    const todayVN = getRealTodayVN();
                    const minhNgocUrl = `https://www.minhngoc.net/ket-qua-xo-so/${todayVN}.html`;
                    const displayDate = todayVN.split('-').reverse().join('/');

                    statusBox.style.display = 'none';
                    resultBox.innerHTML = `
                        <div class="minhngoc-btn-wrap">
                            <a class="minhngoc-btn" href="${minhNgocUrl}" target="_blank" rel="noopener noreferrer" title="Xem kết quả ngày ${displayDate} trên Minh Ngọc">
                                🔗 XEM KẾT QUẢ TRỰC TIẾP — <span class="date">${displayDate}</span>
                            </a>
                        </div>`;
                } else {
                    showStatus('error', err.message);
                }
            }
        }

        function updateProbabilityExtra() {
            const region = probRegion.value;
            const type = probType.value;
            const needsExtra = region === 'bac' && (type === 'cap' || type === 'bo3');
            probExtraGroup.style.display = needsExtra ? '' : 'none';

            if (type === 'cap') {
                probExtra.placeholder = 'VD: 23-53, 15-68';
            } else if (type === 'bo3') {
                probExtra.placeholder = 'VD: 15-58-69, 12-34-56';
            } else {
                probExtra.placeholder = 'VD: 23-53 hoặc 15-58-69';
            }
        }

        function updateProbabilityTypes() {
            const region = probRegion.value;
            const currentType = probType.value;

            const mtmnOnlyTypes = new Set(['2so_dbg8_mtmn']);
            const mbOnlyTypes = new Set(['cap', 'bo3']);

            Array.from(probType.options).forEach(option => {
                const isMtMnOnly = mtmnOnlyTypes.has(option.value);
                const isMbOnly = mbOnlyTypes.has(option.value);

                option.hidden =
                    (isMtMnOnly && region === 'bac') ||
                    (isMbOnly && region !== 'bac');

                option.disabled = option.hidden;
            });

            const invalidForRegion =
                (region === 'bac' && currentType === '2so_dbg8_mtmn') ||
                (region !== 'bac' && (currentType === 'cap' || currentType === 'bo3'));

            if (invalidForRegion) {
                probType.value = '2so';
            }

            updateProbabilityExtra();
        }

        // ============================================================
        // QUẢN LÝ ĐÀI THEO MIỀN + THỨ
        // ============================================================
        function getWeekdayLabel(value) {
            const labels = { '1':'Thứ 2', '2':'Thứ 3', '3':'Thứ 4', '4':'Thứ 5', '5':'Thứ 6', '6':'Thứ 7' };
            return labels[value] || '';
        }

        function getStationsByRegionWeekday(region, weekday) {
            if (weekday === 'all') return STATIONS_BY_REGION[region] || [];
            const day = Number(weekday);
            if (region === 'nam') return STATIONS_BY_WEEKDAY_MN[day] || [];
            if (region === 'trung') return STATIONS_BY_WEEKDAY_MT[day] || [];
            if (region === 'bac') {
                const station = STATIONS_BY_WEEKDAY_MB[day];
                return station ? [station] : [];
            }
            return [];
        }

        function resetProbabilitySubFilters() {
            probType.value = '2so';
            probExtra.value = '';
            updateProbabilityTypes();
            updateProbabilityExtra();
        }

        function updateStationDropdown() {
            const region = probRegion.value;
            const weekday = probWeekday.value;

            if (region === 'bac') {
                if (probWeekdayGroup) probWeekdayGroup.style.display = 'none';
                if (probStationGroup) probStationGroup.style.display = '';
                probStation.innerHTML = '<option value="all">Tất cả đài</option>';
                (STATIONS_BY_REGION.bac || []).forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    probStation.appendChild(option);
                });
                probStation.value = 'all';
                return;
            }

            if (probWeekdayGroup) probWeekdayGroup.style.display = '';

            if (weekday === 'all') {
                probStation.value = 'all';
                probStation.innerHTML = '<option value="all">Tất cả đài của cả tuần</option>';
                if (probStationGroup) probStationGroup.style.display = 'none';
                return;
            }

            if (probStationGroup) probStationGroup.style.display = '';
            const stations = getStationsByRegionWeekday(region, weekday);
            const label = getWeekdayLabel(weekday);
            probStation.innerHTML = '';

            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = `Tất cả đài của ${label}`;
            probStation.appendChild(allOption);

            stations.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                probStation.appendChild(option);
            });
            probStation.value = 'all';
        }

        probRegion.addEventListener('change', () => {
            probWeekday.value = 'all';
            probStation.value = 'all';
            updateStationDropdown();
            resetProbabilitySubFilters();
        });

        probWeekday.addEventListener('change', () => {
            probStation.value = 'all';
            updateStationDropdown();
            resetProbabilitySubFilters();
        });

        probStation.addEventListener('change', () => {
            updateProbabilityTypes();
            updateProbabilityExtra();
        });

        probType.addEventListener('change', updateProbabilityExtra);

        probWeekday.value = 'all';
        probStation.value = 'all';
        updateStationDropdown();
        probType.value = '2so';
        updateProbabilityTypes();
        updateProbabilityExtra();

        switchRangeMode();

        function getDatesToLoad() {
            const mode = document.querySelector('input[name="rangeMode"]:checked').value;
            const allSorted = Array.from(availableDates).sort().reverse();

            if (mode === 'year') {
                const year = getCurrentYearVN();
                const today = getTodayISODateVN();
                return allSorted.filter(iso => iso >= `${year}-01-01` && iso <= today);
            } else if (mode === 'recent') {
                const days = parseInt(probDays.value, 10);
                if (!days || allSorted.length === 0) return [];

                const latestIso = allSorted[0];
                const [ly, lm, ld] = latestIso.split('-').map(Number);
                const latestDate = new Date(Date.UTC(ly, lm - 1, ld));
                const fromDate = new Date(latestDate);
                fromDate.setUTCDate(fromDate.getUTCDate() - (days - 1));

                const result = [];
                for (let i = 0; i < days; i++) {
                    const d = new Date(fromDate);
                    d.setUTCDate(fromDate.getUTCDate() + i);
                    result.push([
                        d.getUTCFullYear(),
                        String(d.getUTCMonth() + 1).padStart(2, '0'),
                        String(d.getUTCDate()).padStart(2, '0')
                    ].join('-'));
                }

                return result.reverse();
            } else {
                const from = probFromDate.value;
                const to = probToDate.value;
                if (!from || !to) return [];
                return allSorted.filter(iso => iso >= from && iso <= to);
            }
        }

        // FIX #3: Fetch song song có giới hạn concurrency (thay vì tuần tự)
        async function fetchWithConcurrency(items, worker, limit = 16) {
            const results = new Array(items.length);
            let cursor = 0;
            let done = 0;

            async function run() {
                while (true) {
                    const idx = cursor++;
                    if (idx >= items.length) return;
                    try {
                        results[idx] = await worker(items[idx], idx);
                    } catch (e) {
                        results[idx] = null;
                    }
                    done++;
                }
            }

            const runners = [];
            const n = Math.min(limit, items.length);
            for (let i = 0; i < n; i++) runners.push(run());
            await Promise.all(runners);
            return results;
        }

        async function loadDaysData() {
            const datesToLoad = getDatesToLoad();
            if (datesToLoad.length === 0) return [];

            const allData = [];
            let loaded = 0;
            const total = datesToLoad.length;

            // Cập nhật tiến độ mỗi 10 file
            const tick = () => {
                loaded++;
                if (loaded % 10 === 0 || loaded === total) {
                    showProbStatus('loading', `ĐANG TẢI... ${loaded}/${total}`);
                }
            };

            const results = await fetchWithConcurrency(
                datesToLoad,
                async (iso) => {
                    const year = iso.slice(0, 4);
                    try {
                        const res = await fetch(`data/${year}/${iso}.json?_=${Date.now()}`);
                        if (!res.ok) { tick(); return null; }
                        const dayData = await res.json();
                        tick();
                        return { date: iso, regions: dayData.regions || [] };
                    } catch (e) {
                        console.warn('Skip', iso, e.message);
                        tick();
                        return null;
                    }
                },
                16
            );

            // Giữ thứ tự ngày tăng dần (getDatesToLoad trả về mới -> cũ, ta đảo lại cho tự nhiên)
            for (const r of results) {
                if (r) allData.push(r);
            }
            return allData;
        }

        const STATIONS_BY_WEEKDAY_MT = {
            0: ["Phú Yên", "Huế"],
            1: ["Đắk Lắk", "Quảng Nam"],

        const STATIONS_BY_WEEKDAY_MB = {
            0: "Hà Nội",

            2: "Bắc Ninh",
            3: "Hà Nội",
            4: "Hải Phòng",

        // FIX #2: Chuẩn hóa tên đài — bỏ dấu tiếng Việt, bỏ dấu chấm, gộp khoảng trắng
        function normalizeStationName(name) {
            return String(name || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')   // bỏ dấu
                .replace(/đ/g, 'd').replace(/Đ/g, 'D')
                .replace(/[.\s]+/g, ' ')            // gộp dấu chấm + khoảng trắng
                .trim()
                .toLowerCase();
        }

        function getWeekdayUTC(isoDate, offsetDays = 0) {
            if (typeof isoDate !== 'string') return null;
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate.trim());
            if (!match) return null;
            const y = Number(match[1]);
            const m = Number(match[2]);
            const d = Number(match[3]);
            if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d) || m < 1 || m > 12 || d < 1 || d > 31) return null;
            const date = new Date(Date.UTC(y, m - 1, d));
            if (Number.isNaN(date.getTime())) return null;
            const offset = Number(offsetDays);
            if (!Number.isInteger(offset)) return null;
            if (offset) date.setUTCDate(date.getUTCDate() + offset);
            return date.getUTCDay();
        }

        function getScheduledStationsForWeekday(regionKey, weekday) {
            if (regionKey === 'trung') return STATIONS_BY_WEEKDAY_MT[weekday] || [];
            if (regionKey === 'nam') return STATIONS_BY_WEEKDAY_MN[weekday] || [];
            if (regionKey === 'bac') {
                const station = STATIONS_BY_WEEKDAY_MB[weekday];
                return station ? [station] : [];
            }
            return [];
        }

        const SCHEDULE_WEEKDAY_OFFSETS = [0, -1, 1];

        // Cache detectScheduleOffset theo key "date|regionKey" để tránh tính lặp
        const _scheduleOffsetCache = new Map();

        function detectScheduleOffset(day, regionKey = null) {
            if (!day || !day.date || !Array.isArray(day.regions)) return 0;
            const cacheKey = `${day.date}|${regionKey || 'all'}`;
            if (_scheduleOffsetCache.has(cacheKey)) return _scheduleOffsetCache.get(cacheKey);

            const actualStations = [];
            day.regions.forEach(region => {
                if (regionKey && region.key !== regionKey) return;
                if (!['nam', 'trung', 'bac'].includes(region.key)) return;
                (region.stations || []).forEach(st => {
                    const name = normalizeStationName(st.name);
                    if (name) actualStations.push({ regionKey: region.key, name });
                });
            });
            if (!actualStations.length) {
                _scheduleOffsetCache.set(cacheKey, 0);
                return 0;
            }
            let bestOffset = 0, bestScore = -1;
            for (const offset of SCHEDULE_WEEKDAY_OFFSETS) {
                const weekday = getWeekdayUTC(day.date, offset);
                let score = 0;
                actualStations.forEach(({ regionKey: rk, name }) => {
                    if (getScheduledStationsForWeekday(rk, weekday).some(x => normalizeStationName(x) === name)) score++;
                });
                if (score > bestScore) { bestScore = score; bestOffset = offset; }
            }
            _scheduleOffsetCache.set(cacheKey, bestOffset);
            return bestOffset;
        }

        function isScheduledStation(regionKey, stationName, isoDate, scheduleOffset = 0) {
            if (!isoDate || !stationName) return false;
            const weekday = getWeekdayUTC(isoDate, scheduleOffset);
            if (weekday === null) return false;
            const station = normalizeStationName(stationName);
            return getScheduledStationsForWeekday(regionKey, weekday).some(name => normalizeStationName(name) === station);
        }

        function isProbabilityWeekday(day, probWeekday) {
            if (!day || !day.date) return false;
            if (probWeekday === undefined || probWeekday === null || probWeekday === '' || probWeekday === 'all') return true;
            const selected = Number(probWeekday);
            if (!Number.isInteger(selected) || selected < 1 || selected > 6) return false;
            return getWeekdayUTC(day.date, 0) === selected;
        }

        function getProbabilityDrawKey(day, regionKey, stationName) {
            return `${day.date}|${regionKey}|${normalizeStationName(stationName)}`;
        }

        function getStationByRegion(day, regionKey, stationFilter = 'all', weekdayFilter = 'all') {
            if (!day || !Array.isArray(day.regions)) return [];
            if (!isProbabilityWeekday(day, weekdayFilter)) return [];

            const wanted = normalizeStationName(stationFilter);
            const region = day.regions.find(r => r.key === regionKey);
            if (!region || !Array.isArray(region.stations)) return [];

            const scheduleOffset = detectScheduleOffset(day, regionKey);

            return region.stations.filter(st => {
                const name = String(st.name || '').trim();
                if (!name) return false;
                if (stationFilter && stationFilter !== 'all' && normalizeStationName(name) !== wanted) return false;
                return isScheduledStation(regionKey, name, day.date, scheduleOffset);
            });
        }

        function extractNumericNumbers(station) {
            const numbers = [];
            (station?.prizes || []).forEach(prize => {
                (prize.numbers || []).forEach(num => {
                    const value = String(num).trim();
                    if (/^\d+$/.test(value)) numbers.push(value);
                });
            });
            return numbers;
        }

        function extractPrizeTails(station, labels) {
            const wanted = new Set(labels.map(x => String(x).replace(/\s+/g, ' ').trim().toLowerCase()));
            const result = {};
            wanted.forEach(label => { result[label] = []; });
            (station?.prizes || []).forEach(prize => {
                const label = String(prize.label || '').replace(/\s+/g, ' ').trim().toLowerCase();
                if (!wanted.has(label)) return;
                (prize.numbers || []).forEach(num => {
                    const value = String(num).trim();
                    if (/^\d+$/.test(value) && value.length >= 2) result[label].push(value.slice(-2));
                });
            });
            return result;
        }

        const EXPECTED_NUMBERS_PER_DRAW = { nam: 18, trung: 18, bac: 27 };

        function analyzeTailsDBG8MTMN(allData, stationFilter = 'all', weekdayFilter = 'all') {
            const counter = {};
            for (let i = 0; i <= 99; i++) {
                const tail = String(i).padStart(2, '0');
                counter[tail] = { count: 0, dates: new Set(), stations: new Map() };
            }

            let totalNumbers = 0;
            const analyzedDays = new Set();
            const analyzedDraws = new Set();

            (allData || []).forEach(day => {
                ['nam', 'trung'].forEach(regionKey => {
                    getStationByRegion(day, regionKey, stationFilter, weekdayFilter).forEach(st => {
                        const drawKey = getProbabilityDrawKey(day, regionKey, st.name);
                        if (analyzedDraws.has(drawKey)) return;

                        const tails = extractPrizeTails(st, ['Giải ĐB', 'Giải tám']);
                        const db = tails['giải đb'] || [];
                        const g8 = tails['giải tám'] || [];

                        if (db.length !== 1 || g8.length !== 1) return;

                        analyzedDraws.add(drawKey);
                        analyzedDays.add(day.date);

                        [db[0], g8[0]].forEach(tail => {
                            counter[tail].count++;
                            counter[tail].dates.add(day.date);
                            counter[tail].stations.set(st.name, (counter[tail].stations.get(st.name) || 0) + 1);
                            totalNumbers++;
                        });
                    });
                });
            });

            return { counter, totalNumbers, analyzedDays, analyzedDraws };
        }

        function analyzeTails(allData, regionKey, tailLen, stationFilter = 'all', weekdayFilter = 'all') {
            const counter = {};
            const maxTail = Math.pow(10, tailLen);
            for (let i = 0; i < maxTail; i++) counter[String(i).padStart(tailLen, '0')] = { count: 0, dates: new Set(), stations: new Map() };
            let totalNumbers = 0;
            const analyzedDays = new Set();
            const analyzedDraws = new Set();
            const expectedPerDraw = EXPECTED_NUMBERS_PER_DRAW[regionKey] || 0;

            (allData || []).forEach(day => {
                getStationByRegion(day, regionKey, stationFilter, weekdayFilter).forEach(st => {
                    const drawKey = getProbabilityDrawKey(day, regionKey, st.name);
                    if (analyzedDraws.has(drawKey)) return;
                    const numbers = extractNumericNumbers(st);
                    if (numbers.length !== expectedPerDraw) return;
                    analyzedDraws.add(drawKey);
                    analyzedDays.add(day.date);
                    numbers.forEach(value => {
                        const tail = value.padStart(tailLen, '0').slice(-tailLen);
                        if (!/^\d+$/.test(tail)) return;
                        counter[tail].count++;
                        counter[tail].dates.add(day.date);
                        counter[tail].stations.set(st.name, (counter[tail].stations.get(st.name) || 0) + 1);
                        totalNumbers++;
                    });
                });
            });

            const drawsCount = analyzedDraws.size;
            const expectedTotalNumbers = drawsCount * expectedPerDraw;
            if (totalNumbers !== expectedTotalNumbers) console.warn('Mẫu số không khớp kỳ vọng:', { regionKey, tailLen, drawsCount, expectedPerDraw, totalNumbers, expectedTotalNumbers, weekdayFilter, stationFilter });
            return { counter, totalNumbers, drawsCount, analyzedDays, analyzedDraws, expectedPerDraw, expectedTotalNumbers };
        }

        function analyzeCombos(allData, combos, stationFilter = 'all', weekdayFilter = 'all') {
            const result = {};
            const analyzedDays = new Set();
            const analyzedDraws = new Set();
            combos.forEach(combo => { result[combo.join("-")] = { days: [], combo }; });

            (allData || []).forEach(day => {
                const allTails = new Set();
                let hasEligibleDraw = false;
                getStationByRegion(day, 'bac', stationFilter, weekdayFilter).forEach(st => {
                    const drawKey = getProbabilityDrawKey(day, 'bac', st.name);
                    if (analyzedDraws.has(drawKey)) return;
                    const numbers = extractNumericNumbers(st);
                    if (numbers.length !== EXPECTED_NUMBERS_PER_DRAW.bac) return;
                    analyzedDraws.add(drawKey);
                    hasEligibleDraw = true;
                    numbers.forEach(num => allTails.add(num.slice(-2)));
                });
                if (!hasEligibleDraw) return;
                analyzedDays.add(day.date);
                combos.forEach(combo => {
                    if (combo.every(n => allTails.has(n))) result[combo.join("-")].days.push(day.date);
                });
            });
            return { result, analyzedDays, analyzedDraws };
        }

        // FIX #1: XÓA hàm downloadCSV (dead code, sai kiểu dữ liệu). Chỉ giữ downloadProbabilityCSV.
        function downloadProbabilityCSV(data, filename) {
            let csv = "\uFEFF" + "STT,Số,Số lần,Xác suất,Đài xuất hiện,Ngày xuất hiện\n";

            const totalNumbers = data.reduce((sum, item) => sum + (item.count || 0), 0);

            data.forEach((item, i) => {
                const pct = totalNumbers > 0
                    ? (item.count / totalNumbers * 100).toFixed(2) + "%"
                    : "0%";

                const stations = `"${String(item.stations || '-').replace(/"/g, '""')}"`;
                const dates = `"${String(item.dates || '-').replace(/"/g, '""')}"`;
                csv += `${i + 1},${item.num},${item.count},${pct},${stations},${dates}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename + '.csv';
            link.click();

            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

                const regionLabel = stationFilter && stationFilter !== 'all'
                    ? `${stationFilter} (${regionNames[region]} — ${weekdayLabel})`
                    : `${regionNames[region]} — ${weekdayLabel}`;

                const runTail = (tailLen) => {
                    const data = analyzeTails(allData, region, tailLen, stationFilter, weekdayFilter);
                    if (!data.totalNumbers) return null;
                    const dates = Array.from(data.analyzedDays).sort();
                    return {
                        html: renderTailResult(
                            data.counter, data.totalNumbers, tailLen, regionLabel,
                            data.analyzedDays.size,
                            dates[0] || null,
                            dates[dates.length - 1] || null,
                            'Ngày có dữ liệu', data.drawsCount, 'Tổng số mẫu'
                        ),
                        drawsCount: data.drawsCount,
                        totalNumbers: data.totalNumbers
                    };
                };

                const runDBG8 = () => {
                    if (region === 'bac') return null;
                    const data = analyzeTailsDBG8MTMN(allData, stationFilter, weekdayFilter);
                    if (!data.totalNumbers) return null;
                    const dates = Array.from(data.analyzedDays).sort();
                    return {
                        html: renderTailResult(
                            data.counter, data.totalNumbers, 2,
                            'ĐB + G8 (Miền Trung + Miền Nam)',
                            data.analyzedDays.size,
                            dates[0] || null,
                            dates[dates.length - 1] || null,
                            'Ngày có kỳ xổ', data.analyzedDraws.size, 'Tổng mẫu'
                        ),
                        drawsCount: data.analyzedDraws.size,
                        totalNumbers: data.totalNumbers
                    };
                };

                const parseCombos = (requestedType) => {
                    const raw = probExtra.value.trim();
                    const capCombos = [], bo3Combos = [], invalid = [];
                    if (!raw) return { capCombos, bo3Combos, invalid: [] };

                    for (const chunk of raw.split(',')) {
                        const parts = chunk.trim().split('-').map(p => p.trim()).filter(Boolean);
                        const valid2 = parts.length === 2 && parts.every(p => /^\d{2}$/.test(p)) && new Set(parts).size === 2;
                        const valid3 = parts.length === 3 && parts.every(p => /^\d{2}$/.test(p)) && new Set(parts).size === 3;

                        if (requestedType === 'cap' && valid2) capCombos.push(parts);
                        else if (requestedType === 'bo3' && valid3) bo3Combos.push(parts);
                        else invalid.push(chunk);
                    }
                    return { capCombos, bo3Combos, invalid };
                };

                const runCombo = (combos) => {
                    if (!combos.length) return null;
                    const data = analyzeCombos(allData, combos, stationFilter, weekdayFilter);
                    const drawsCount = data.analyzedDraws.size;
                    if (!drawsCount) return null;
                    return {
                        html: renderComboResult(data.result, combos, drawsCount, 'Kỳ có dữ liệu'),
                        drawsCount
                    };
                };

                if (type === '2so_dbg8_mtmn') {
                    const data = runDBG8();
                    if (!data) {
                        showProbStatus('error', 'KHÔNG CÓ DỮ LIỆU ĐB + G8 CỦA MIỀN TRUNG / MIỀN NAM');
                        btnAnalyze.disabled = false;
                        return;
                    }
                    probResult.innerHTML = data.html;
                    showProbStatus('success', `HOÀN TẤT :: ${data.drawsCount} KỲ XỔ, ${data.totalNumbers.toLocaleString()} MẪU — ĐB + G8 MT + MN${stationFilter !== 'all' ? ' — ' + stationFilter : ''}`);
                    btnAnalyze.disabled = false;
                    return;
                }

                if (type === 'cap' || type === 'bo3') {
                    if (region !== 'bac') {
                        showProbStatus('error', 'CHỈ HỖ TRỢ MIỀN BẮC CHO CẶP/BỘ 3');
                        btnAnalyze.disabled = false;
                        return;
                    }
                    const parsed = parseCombos(type);
                    if (parsed.invalid.length) {
                        showProbStatus('error', 'SAI ĐỊNH DẠNG: ' + parsed.invalid.join(', '));
                        btnAnalyze.disabled = false;
                        return;
                    }
                    const combos = type === 'cap' ? parsed.capCombos : parsed.bo3Combos;
                    const data = runCombo(combos);
                    if (!data) {
                        showProbStatus('error', 'KHÔNG CÓ KỲ MB PHÙ HỢP VỚI ĐÀI ĐÃ CHỌN');
                        btnAnalyze.disabled = false;
                        return;
                    }
                    probResult.innerHTML = data.html;
                    showProbStatus('success', `HOÀN TẤT :: ${data.drawsCount} KỲ MB${stationFilter !== 'all' ? ' — ' + stationFilter : ''}`);
                    btnAnalyze.disabled = false;
                    return;
                }

                const tailLen = type === '2so' ? 2 : 3;
                const data = runTail(tailLen);
                if (!data) {
                    showProbStatus('error', 'KHÔNG CÓ SỐ NÀO TRONG CÁC KỲ XỔ HỢP LỆ');
                    btnAnalyze.disabled = false;
                    return;
                }
                probResult.innerHTML = data.html;
                showProbStatus('success', `HOÀN TẤT :: ${data.drawsCount} KỲ, ${data.totalNumbers.toLocaleString()} MẪU${stationFilter !== 'all' ? ' — ' + stationFilter : ''}`);
                btnAnalyze.disabled = false;
            } catch (err) {
                console.error(err);
                showProbStatus('error', 'LỖI: ' + err.message);
                btnAnalyze.disabled = false;
            }
        });

        (async () => {
            await loadIndex();
            loadResult(dateInput.value);
        })();
    </script>
</body>
</html>
