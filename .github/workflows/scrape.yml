name: Scrape xổ số

on:
  schedule:
    # Chạy lúc 22:00 UTC = 05:00 VN (hôm qua đã có KQ đầy đủ)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Chạy scraper
        run: python scraper.py

      - name: Commit dữ liệu mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 Cập nhật KQXS $(date +'%Y-%m-%d')"
          git push
